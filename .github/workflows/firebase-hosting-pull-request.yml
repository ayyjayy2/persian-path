# Deploys every PR to one shared preview channel, "next", so the preview link never changes.
# The channel shows whichever PR pushed last; work goes one ticket at a time.
# Each deploy resets the 30-day expiry, so the link stays the same while work continues.
name: Deploy preview
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: preview-next
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-precache.js
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSIAN_LEARNIN }}
          channelId: next
          expires: 30d
          projectId: persian-learnin
      # Check the deployed preview itself: it loads, serves this build and hides repo-only files
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: UI tests on the preview link
        run: npx playwright test tests/ui
        env:
          BASE_URL: ${{ steps.deploy.outputs.details_url }}
