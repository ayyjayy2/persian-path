<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Persian Learnin — Learn Persian</title>
  <meta name="description" content="Learn Persian one lesson at a time — script, sounds, vocabulary and conversation." />
  <meta name="theme-color" content="#f3f2f2" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192-v2.png" />
  <!-- Icon files carry a version suffix: iOS caches home screen icons by URL, so a new icon needs a new file name -->
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-v2.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Persian Learnin" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap" />
  <link rel="stylesheet" href="ds/classical.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

  <!-- Vendored so the app runs offline: Leaflet 1.9.4. Firebase 13.1.0 (vendor/firebase.js) loads from backend.js. -->
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="culture.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // Last resort: if the app hasn't drawn anything after 12 seconds (a file failed to load),
    // show a way out instead of a blank, frozen screen.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || app.firstChild) return;
      app.innerHTML = '<div class="pl-crash"><h1>Still loading…</h1><p>Persian Learnin is taking longer than usual. Check your connection and try again.</p><button type="button">Reload</button></div>';
      app.querySelector('button').addEventListener('click', function () { location.reload(); });
    }, 12000);
  </script>
  <noscript>Persian Learnin needs JavaScript to run.</noscript>
</body>
</html>
